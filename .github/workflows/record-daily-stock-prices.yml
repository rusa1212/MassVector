name: Record daily stock prices

on:
  schedule:
    # 14:10 KST, Monday-Friday. The provider publishes the previous
    # business day's data after 13:00 KST.
    - cron: "10 5 * * 1-5"
  workflow_dispatch:

concurrency:
  group: record-daily-stock-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Fetch and record closing prices
        working-directory: web
        env:
          PUBLIC_DATA_SERVICE_KEY: ${{ secrets.PUBLIC_DATA_SERVICE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/update-stock-prices.mjs
